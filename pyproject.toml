[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keroyok-ai-backend"
version = "0.1.0"
description = "FastAPI AI backend for Keroyok.AI's PM-agent MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "openai>=1.40.0,<2.0.0",
  "azure-search-documents>=11.6.0b1,<12.0.0",
  "azure-identity>=1.17.0,<2.0.0",
  "agent-framework>=1.0.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

